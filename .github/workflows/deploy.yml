# Construit le site à chaque poussée sur `main` et le publie sur GitHub Pages.
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

# Autorisations nécessaires au dépôt de l'artefact et à sa publication.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; les poussées suivantes attendent leur tour.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
