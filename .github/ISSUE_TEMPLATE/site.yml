name: Signaler un problème sur le site
description: Coquille, affichage cassé, lien mort, obstacle d'accessibilité, lenteur.
title: "[Site] "
labels: ["site"]
body:
  - type: markdown
    attributes:
      value: >-
        Pour une **faille de sécurité**, n'utilisez pas ce formulaire : passez
        par le [signalement privé](https://github.com/Megamax76/creacomp-site/security/advisories/new).

  - type: input
    id: page
    attributes:
      label: Sur quelle page ?
      placeholder: "https://creacomp.org/referentiel/rechercher-et-sourcer/"
    validations:
      required: true

  - type: textarea
    id: probleme
    attributes:
      label: Que se passe-t-il ?
      description: Ce que vous avez vu, et ce que vous attendiez à la place.
    validations:
      required: true

  - type: dropdown
    id: nature
    attributes:
      label: De quel ordre ?
      options:
        - coquille ou erreur de langue
        - affichage cassé ou mise en page
        - lien mort
        - accessibilité (clavier, lecteur d'écran, contraste)
        - lenteur ou performance
        - autre
    validations:
      required: true

  - type: input
    id: environnement
    attributes:
      label: Avec quoi ?
      description: >-
        Navigateur, système, taille d'écran. Précisez le thème (clair ou sombre)
        si le problème est visuel.
      placeholder: "Firefox 141 · macOS · mobile · thème sombre"

  - type: textarea
    id: console
    attributes:
      label: La console affiche-t-elle quelque chose ?
      description: >-
        Facultatif, mais précieux. La console du navigateur doit être **vide** au
        chargement : tout message y est en soi un défaut. Elle s'ouvre avec F12,
        onglet « Console ».
      render: text
